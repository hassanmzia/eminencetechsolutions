version: '3.9'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: eminence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eminence_db}
      POSTGRES_USER: ${POSTGRES_USER:-eminence_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eminence_dev_password_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "25433:5432"  # Using 25433 externally to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eminence_user} -d ${POSTGRES_DB:-eminence_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eminence-network

  # ============================================
  # Redis (Cache, Celery Broker, Session Store)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: eminence-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"  # Using 6380 externally to avoid conflicts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eminence-network

  # ============================================
  # Django Backend API
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eminence-backend
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py seed_data &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
      "
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-not-for-production-use}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - POSTGRES_DB=${POSTGRES_DB:-eminence_db}
      - POSTGRES_USER=${POSTGRES_USER:-eminence_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eminence_dev_password_2024}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eminence-network

  # ============================================
  # Celery Worker (Background Tasks)
  # ============================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eminence-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-not-for-production-use}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - POSTGRES_DB=${POSTGRES_DB:-eminence_db}
      - POSTGRES_USER=${POSTGRES_USER:-eminence_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eminence_dev_password_2024}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - eminence-network

  # ============================================
  # React Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eminence-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"  # Using 3001 externally to avoid conflicts
    networks:
      - eminence-network

  # ============================================
  # Nginx Reverse Proxy (Main Entry Point)
  # ============================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: eminence-nginx
    restart: unless-stopped
    ports:
      - "3021:80"  # Using 3021 externally since port 80 is occupied
    depends_on:
      - backend
      - frontend
    networks:
      - eminence-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local

networks:
  eminence-network:
    driver: bridge
    name: eminence-network
